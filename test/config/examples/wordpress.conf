server {
	server_name				localhost 127.0.0.1;

	listen					80;

	access_log				/dev/stdout;
	error_log				/dev/stderr;

	root					/var/www/html/;
	index					index.php index.html;

	absolute_redirect		off;

	location / {
		try_files 			$uri $uri/ =404;
	}

	location = /wordpress {
		return				302 /wordpress/$is_args$args;
	}

	location /wordpress/ {
		alias				/var/www/localhost/wordpress/;
		add_header			Access-Control-Allow-Origin "*";
		try_files			$uri $uri/ /wordpress/index.php$is_args$args /wordpress/?error=404;
	}

	location = /wordpress/wp-admin {
		return				302 /wordpress/wp-admin/$is_args$args;
	}

	location ~ ^/wordpress/((?:index|wp-login|wp-cron|wp-comments-post|wp-admin/(?!(?:install|install-helper|setup-config)\.php)[^/]+)\.php)(/.*)?$ {
		try_files			/wordpress/$1 /wordpress/?error=404;

		include				fastcgi_params;
		fastcgi_param		SCRIPT_FILENAME $document_root/wordpress/$1;
		fastcgi_param		SCRIPT_NAME /wordpress/$1;
		fastcgi_param		PATH_INFO $2;

		fastcgi_pass		wordpress:9000;
	}

	location ~ ^/wordpress/(.+\.php)(/.*)?$ {
		rewrite				^(.*)$ /wordpress/?error=404? last;
	}
}
