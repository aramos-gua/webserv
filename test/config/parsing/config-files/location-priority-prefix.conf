events {
    worker_connections 1024;
}

http {
    server {
        listen 8080;

        location ~$ .php {
            return 502;
        }

        location /assets/ {
            autoindex on;
        }

        location ^~ /assets/fonts/ {
            root /srv/fonts;

            location ^~ /assets/fonts/vendor/ {
                internal;
            }
        }

        location = /assets/logo.png {
            return 304;
        }

        location ^~ /static/ {
            root /srv/static;
        }
    }
}
