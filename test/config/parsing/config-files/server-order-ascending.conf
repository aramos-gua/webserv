events {
    worker_connections 1024;
}

http {
    server {
        listen 0.0.0.0:8080;
        server_name alpha.example.com;
        root /srv/alpha;
    }
    server {
        listen 0.0.0.0:8081;
        server_name beta.example.com;
        root /srv/beta;
    }
    server {
        listen 0.0.0.0:8082;
        server_name gamma.example.com;
        root /srv/gamma;
    }
}
