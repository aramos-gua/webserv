events {
    worker_connections 1024;
}

http {
    error_log /var/log/penguinx/http.log;

    server {
        listen 8080;
        error_log /var/log/penguinx/server.log warn;

        location = /fatal  { error_log /var/log/penguinx/fatal.log fatal; }
        location = /error  { error_log /var/log/penguinx/error.log error; }
        location = /info   { error_log /var/log/penguinx/info.log info; }
        location = /debug  { error_log /var/log/penguinx/debug.log debug; }
        location = /none   { error_log /var/log/penguinx/none.log; }
    }
}
