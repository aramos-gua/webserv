events {
    worker_connections 1024;
}

http {
    server {
        listen 0.0.0.0:8082;
        listen 0.0.0.0:8080 default_server;
        server_name zeta.example.com alpha.example.com;
        root /srv/multi;
    }
    server {
        listen 0.0.0.0:8080;
        server_name _;
        root /srv/catch-all;
    }
    server {
        listen 0.0.0.0:8082;
        server_name beta.example.com;
        root /srv/beta;
    }
}
