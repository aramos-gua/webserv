# Every directive the parser understands, written in a deliberately scrambled
# order and in the least normalised form accepted for each one.

daemon on;
worker_processes 1;
user www-data www-group;
error_log /var/log/penguinx/error.log;

events {
    worker_connections 512;
}

http {
    autoindex off;
    error_page 404 /404.html;
    include all-directives-included.conf;
    access_log /var/log/penguinx/access.log;
    error_page 500 502 503 504 =200 /50x.html;
    client_max_body_size 1m;
    index index.html index.htm;
    root /srv/penguinx;
    allow all;

    server {
        server_name zeta.example.com alpha.example.com;
        listen 8080 default_server;
        try_files /index.html /index.htm =404;
        listen 127.0.0.1:9090;
        root /srv/penguinx/main;
        error_page 403 /403.html;

        location ~$ .php {
            return 502;
        }

        location = /health {
            return 200 alive;
        }

        location = /cached {
            return 304;
        }

        location /downloads/ {
            alias /srv/penguinx/files/;
            autoindex on;
            limit_except GET HEAD {
                deny all;
                access_log /var/log/penguinx/denied.log;
            }
        }

        location /private/ {
            internal;
            deny 10.0.0.0/8;
        }
    }

    server {
        listen 8080;
        server_name _;
        return 301 http://alpha.example.com/;
    }
}
