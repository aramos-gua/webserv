# NOTE: same configuration as all-directives.conf, with the blocks, the
# directives inside them and the servers themselves in a different order,
# written out longhand where possible

worker_processes 1;
error_log /var/log/penguinx/error.log error;
daemon on;

http {
    server {
        server_name _;
        return 301 http://alpha.example.com/;
        listen [::]:8080;
        listen 0.0.0.0:8080;
    }

    types {
        text/css         css;
        image/png        png;
        text/html        htm html;
        application/json json;
    }

    server {
        error_page 403 /403.html;
        error_log /var/log/penguinx/server-error.log;
        listen 127.0.0.1:9090;

        location ^~ /assets/img/ {
            root /srv/penguinx/images;
        }

        location /private/ {
            deny 10.0.0.0/8;
            internal;
        }

        location /downloads/ {
            limit_except HEAD GET {
                access_log /var/log/penguinx/denied.log;
                deny 0.0.0.0/0;
                deny ::/0;
            }
            autoindex on;
            alias /srv/penguinx/files/;
        }

        listen [::]:8080 default_server;
        root /srv/penguinx/main;

        location ~$ .php {
            return 502;
        }

        location ^~ /assets/ {
            root /srv/penguinx/static;
            autoindex on;
        }

        try_files /index.html /index.htm =404;
        listen 0.0.0.0:8080 default_server;
        server_name alpha.example.com zeta.example.com;

        location = /cached {
            return 304;
        }

        location = /health {
            return 200 alive;
        }
    }

    index index.html index.htm;
    error_page 504 =200 /50x.html;
    root /srv/penguinx;
    error_page 503 =200 /50x.html;
    allow 0.0.0.0/0;
    error_page 502 =200 /50x.html;
    default_type application/octet-stream;
    error_page 500 =200 /50x.html;
    allow ::/0;
    error_page 404 /404.html;
    client_max_body_size 1048576;
    autoindex off;
    access_log /var/log/penguinx/access.log;
}

user www-data www-group;

events {
    worker_connections 512;
}
